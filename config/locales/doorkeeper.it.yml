          other: 'Il code_challenge_method deve essere uno tra %{challenge_methods}.'
        server_error: 'Il server di autorizzazione ha riscontrato una condizione imprevista che gli ha impedito di soddisfare la richiesta.'
        temporarily_unavailable: 'Il server di autorizzazione non è attualmente in grado di gestire la richiesta a causa di un sovraccarico temporaneo o di manutenzione del server.'

        # Messaggi di errore di configurazione
        credential_flow_not_configured: 'Il flusso Resource Owner Password Credentials non è riuscito perché Doorkeeper.configure.resource_owner_from_credentials non è configurato.'
