        admin_authenticator_not_configured: 'L''accesso al pannello di amministrazione è vietato perché Doorkeeper.configure.admin_authenticator non è configurato.'

        # Errori di access grant
        unsupported_response_type: 'Il server di autorizzazione non supporta questo response type.'
        unsupported_response_mode: 'Il server di autorizzazione non supporta questo response mode.'

        # Errori di access token
        invalid_client: 'Autenticazione del client non riuscita a causa di client sconosciuto, autenticazione del client non inclusa o metodo di autenticazione non supportato.'
        invalid_grant: 'L''authorization grant fornito non è valido, è scaduto, è stato revocato, non corrisponde all''URI di reindirizzamento usato nella richiesta di autorizzazione, oppure è stato rilasciato a un altro client.'
        unsupported_grant_type: 'Il grant type di autorizzazione non è supportato dal server di autorizzazione.'

        invalid_token:
          revoked: "L'access token è stato revocato"
          expired: "L'access token è scaduto"
          unknown: "L'access token non è valido"
        revoke:
          unauthorized: "Non sei autorizzato a revocare questo token"

        forbidden_token:
          missing_scope: 'L''accesso a questa risorsa richiede lo scope "%{oauth_scopes}".'

